name: Scheduled Email Reports

# v2.0.3.4 - Agresif yedekli cron (her 5 dakikada bir tetikleme)
#
# Evrim:
# v1.x:    "0 * * * *"                        (1 slot/saat, %83 skip -> mail bazen hic gelmiyordu)
# v2.0.3:  "0,15,30,45 * * * *"               (4 slot/saat, sabah yogun saatlerde
#                                              hepsi skip edilebiliyordu - 1 Temmuz'da
#                                              09:00 ve 12:00 hic tetiklenmedi)
# v2.0.3.4: "*/5 * * * *"                     (12 slot/saat, GitHub kesin 3-4 tanesini calistirir)
#
# NOT (1 Temmuz 2026): Repo public yapildi -> GitHub Actions artik SINIRSIZ ve
# UCRETSIZ (private repo'da 2000 dk/ay free tier limiti asiliyordu, */5 ile
# aylik ~7200 dk gerekiyordu). Public repo'da bu limit kalkti, guvenle
# agresif cron kullanilabilir.
#
# GitHub Actions free tier'da schedule cron TAM ZAMANDA calismaz. Ozellikle sabah
# is basi saatleri (07:00-10:00 UTC dunyada) yogun oldugu icin cron slot'lari
# 30 dakikaya kadar geciktirilir veya tamamen skip edilir.
#
# 5 dakikalik pencerede 12 slot verirsek, en az 3-4'unun tutturulmasi kesin.
# emailer_standalone.py v2.0.3'teki duplicate guard (email_send_log tablosu)
# ayni saatte 2. mail gonderimini engeller:
# "[duplicate-guard] bugun bu saatte zaten gonderildi -> atlandi"
#
# Sonuc: Mail kesin gider, duplicate gitmez.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install pandas yfinance plotly streamlit requests pytefas bcrypt borsapy psycopg2-binary --quiet

      - name: Check data file (informational)
        run: |
          if [ -f "optimized_universe.csv" ]; then
            echo "CSV mevcut: $(wc -l < optimized_universe.csv) satir"
            echo "BIST/MADEN/DOVIZ/KRIPTO icin borsapy ile live refresh uygulanacak."
          else
            echo "UYARI: optimized_universe.csv yok"
          fi

      - name: Send email report
        env:
          EMAIL_ADDRESS:    ${{ secrets.EMAIL_ADDRESS }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_EMAIL:      ${{ secrets.ADMIN_EMAIL }}
        run: python emailer_standalone.py
