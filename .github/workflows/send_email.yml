name: Scheduled Email Reports

# v2.0.3 - Yedekli cron tetiklemeleri (her 15 dakikada bir)
# Onceki versiyon: "0 * * * *" (her saat basi, 24/gun) - GitHub free tier
# tarafindan %83 oraninda skip ediliyordu, mail bazen hic gelmiyordu.
#
# Yeni versiyon: Her saat 4 farkli dakikada tetikleme (XX:00, XX:15, XX:30,
# XX:45). En az birinin tutturma sansi cok yuksek.
#
# emailer_standalone.py v2.0.3 ile duplicate guard eklendi (email_send_log
# tablosu). Yani XX:00'da mail gondersek, XX:15'de tekrar gondermez:
# "[duplicate-guard] bugun bu saatte zaten gonderildi -> atlandi"

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "15 * * * *"
    - cron: "30 * * * *"
    - cron: "45 * * * *"
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install pandas yfinance plotly streamlit requests pytefas bcrypt borsapy psycopg2-binary --quiet

      - name: Check data file (informational)
        run: |
          if [ -f "optimized_universe.csv" ]; then
            echo "CSV mevcut: $(wc -l < optimized_universe.csv) satir"
            echo "BIST/MADEN/DOVIZ/KRIPTO icin borsapy ile live refresh uygulanacak."
          else
            echo "UYARI: optimized_universe.csv yok"
          fi

      - name: Send email report
        env:
          EMAIL_ADDRESS:    ${{ secrets.EMAIL_ADDRESS }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_EMAIL:      ${{ secrets.ADMIN_EMAIL }}
        run: python emailer_standalone.py
