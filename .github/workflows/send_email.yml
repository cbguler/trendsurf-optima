name: Scheduled Email Reports

on:
  schedule:
    # Türkiye UTC+3 — hafta içi:
    # 08:30 TRT = 05:30 UTC
    - cron: "30 5 * * 1-5"
    # 12:00 TRT = 09:00 UTC
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas yfinance plotly streamlit requests pytefas --quiet

      - name: Check data file
        run: |
          if [ -f "optimized_universe.csv" ]; then
            echo "CSV mevcut: $(wc -l < optimized_universe.csv) satir"
          else
            echo "UYARI: optimized_universe.csv bulunamadi"
            echo "Lutfen guncelle_ve_push.bat calistirin"
            exit 1
          fi

      - name: Send email report
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASS:     ${{ secrets.SMTP_PASS }}
        run: python emailer_standalone.py
