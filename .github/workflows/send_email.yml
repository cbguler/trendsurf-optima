name: Scheduled Email Reports

on:
  schedule:
    # v2.0.2 - Her saat basi tetiklen (TRT 7/24)
    # Bahri (veya baska kullanici) sidebar'daki E-Posta Ayarlari'ndan
    # istedigi saati (00:00 - 23:00) secebilir. emailer_standalone.py kodu
    # DB'den o kullanicinin saatlerini okur ve su anki TRT saati eslesirse
    # mail gonderir, eslesmezse sessizce cikar.
    #
    # Onceki versiyon: "50 5 * * 1-5" ve "50 8 * * 1-5" SABIT saatler
    # ile tetikleniyordu (09:00 ve 12:00 icin 10 dk onceden). Bu kullaniciyi
    # 2 saate kilitliyordu. Artik herhangi bir saati secebilir.
    #
    # GitHub Actions cron her zaman tam saatte tetiklenmez (5-15 dk gecikme
    # tipiktir). Bu sebeple cron 0. dakikada tanimli; kod 'now_hour' kismina
    # (saat HH) bakar, dakikayi gozardi eder. Yani saat 09:00 secen kullanici
    # icin 09:00-09:59 araliginda gelen ilk cron mail gonderir, sonraki cron
    # (10:00) artik now_hour=10 oldugu icin atlanir.
    #
    # Free tier kullanim: 24 tetikleme/gun x ~45sn = ~18 dk/gun = ~540 dk/ay
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install pandas yfinance plotly streamlit requests pytefas bcrypt borsapy psycopg2-binary --quiet

      - name: Check data file (informational)
        run: |
          if [ -f "optimized_universe.csv" ]; then
            echo "CSV mevcut: $(wc -l < optimized_universe.csv) satir"
            echo "BIST/MADEN/DOVIZ/KRIPTO icin borsapy ile live refresh uygulanacak."
          else
            echo "UYARI: optimized_universe.csv yok"
            echo "BIST/TEFAS bolumleri bos olabilir; DOVIZ+MADEN+KRIPTO borsapy'den gelir."
          fi

      - name: Send email report
        env:
          EMAIL_ADDRESS:    ${{ secrets.EMAIL_ADDRESS }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_EMAIL:      ${{ secrets.ADMIN_EMAIL }}
        run: python emailer_standalone.py
