name: Scheduled Email Reports

# v2.0.3.8 - Harici tetikleme: cron-job.org (2 Temmuz 2026)
#
# Evrim:
# v1.x:    "0 * * * *"           (1 slot/saat, %83 skip -> mail bazen hic gelmiyordu)
# v2.0.3:  "0,15,30,45 * * * *"  (4 slot/saat, sabah yogun saatlerde hepsi skip
#                                 edilebiliyordu - 1 Temmuz'da 09:00 ve 12:00 hic
#                                 tetiklenmedi)
# v2.0.3.4: "*/5 * * * *"        (12 slot/saat, GitHub'in kendi schedule mekanizmasi
#                                 yine de guvenilmez cikti - 08:17-13:33 arasi 5+ saat
#                                 hic tetiklenmedi, tam Bahri'nin 09:00/12:00 hedef
#                                 saatlerini kapsiyordu)
# v2.0.3.8: GitHub'in kendi schedule bloğu TAMAMEN KALDIRILDI. Bunun yerine
#           cron-job.org (harici, ucretsiz cron servisi) her saat basi (00:00-23:00)
#           GitHub REST API'sine POST istegi atip bu workflow'u workflow_dispatch
#           ile tetikliyor:
#             POST https://api.github.com/repos/cbguler/trendsurf-optima/actions/workflows/send_email.yml/dispatches
#             Body: {"ref":"main"}
#             Auth: fine-grained PAT (sadece bu repo, sadece Actions:write yetkisi)
#
# GitHub'in kendi schedule cron'u free/public tier'da dahi TAM ZAMANDA calismiyor
# (bkz. yukaridaki basarisiz denemeler). cron-job.org disaridan API ile zorlanmis
# tetikleme yaptigi icin bu throttling sorununu tamamen by-pass ediyor.
#
# emailer_standalone.py'deki time-check SADECE SAATI karsilastirir (dakika degil),
# bu yuzden saatlik tetikleme kullanicinin sectigi HERHANGI bir HH:MM degerini
# (serbest metin girisi - E-posta Ayarlari'nda sinirlama yok) yakalamaya yeterli.
# duplicate guard (email_send_log tablosu) ayni saatte 2. gonderimi engeller.
#
# Sonuc (2 Temmuz 2026 12:13 dogrulandi): Mail kesin ve zamaninda gidiyor.
#
# workflow_dispatch: asagida kaliyor - hem cron-job.org'un disaridan tetiklemesi
# hem de GitHub arayuzunden manuel "Run workflow" ile calistirilabilir.

on:
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install pandas yfinance plotly streamlit requests pytefas bcrypt borsapy psycopg2-binary --quiet

      - name: Check data file (informational)
        run: |
          if [ -f "optimized_universe.csv" ]; then
            echo "CSV mevcut: $(wc -l < optimized_universe.csv) satir"
            echo "BIST/MADEN/DOVIZ/KRIPTO icin borsapy ile live refresh uygulanacak."
          else
            echo "UYARI: optimized_universe.csv yok"
          fi

      - name: Send email report
        env:
          EMAIL_ADDRESS:    ${{ secrets.EMAIL_ADDRESS }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_EMAIL:      ${{ secrets.ADMIN_EMAIL }}
        run: python emailer_standalone.py
