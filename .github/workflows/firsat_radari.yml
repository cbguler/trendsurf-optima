name: Firsat Radari

# v2.0.5 - Gun ici tam-evren taramasi + firsat alarmi
#
# - DOVIZ/MADEN/KRIPTO: her kosuda (7/24)
# - BIST (772 hisse tam tarama): script kendi icinde seans kontrolu yapar
#   (hafta ici TRT 10:00-18:30), seans disinda BIST kismini atlar.
# - Sonuclar git'e DEGIL Supabase'e (intraday_scores) yazilir -
#   repo commit gurultusu olusmaz, uygulama tek sorguyla okur.
#
# GitHub cron'un bilinen gecikme/atlama sorunu nedeniyle (bkz. update_data.yml
# gecmisi) asil tetikleyici cron-job.org olacak (workflow_dispatch + PAT,
# mevcut "Veri Guncelle" tetikleyicisiyle ayni yontem). Asagidaki schedule
# yedek olarak durur.

on:
  schedule:
    - cron: '*/20 * * * *'   # Yedek: 20 dk'da bir (GitHub best-effort)
  workflow_dispatch:
    inputs:
      tefas_zorla:
        description: 'TEFAS degerlendirmesini pencere disinda da calistir (test)'
        required: false
        default: '0'

concurrency:
  group: firsat-radari
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    # v2.0.7.101 - 15 -> 20 dakika: Playwright kurulumu + gercek tarayici
    # ile uyandirma adimlarina yer acmak icin.
    timeout-minutes: 20

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari yukle
        run: |
          pip install --upgrade pip --quiet
          pip install pandas yfinance borsapy websockets==16.0 psycopg2-binary streamlit requests --quiet

      - name: Firsat Radari calistir
        run: python firsat_radari.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          SMTP_HOST:  ${{ secrets.SMTP_HOST }}
          SMTP_PORT:  ${{ secrets.SMTP_PORT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          RADAR_TEFAS_ZORLA: ${{ github.event.inputs.tefas_zorla || '0' }}

      # v2.0.7.101 - KRITIK DUZELTME (Bahri'nin bulgusu, 22 Temmuz 2026):
      # v2.0.5.2'deki curl tabanli keep-alive ARTIK ISE YARAMIYOR -
      # Streamlit'in guncel mimarisinde gercek bir tarayici JavaScript
      # calistirip WebSocket baglantisi kurmadan uygulama hic baslamiyor;
      # curl sadece STATIK bir HTML kabugu aliyor (HTTP 200 donse bile
      # uygulama gercekte uyanmiyor). Playwright ile gercek (headless)
      # Chromium kurup GERCEK bir tarayici ziyareti yapiliyor.
      - name: Playwright kur
        if: always()
        continue-on-error: true
        run: |
          pip install playwright --quiet
          python -m playwright install --with-deps chromium

      - name: Uygulamayi uyandir (gercek tarayici ile keep-alive)
        if: always()
        continue-on-error: true
        run: python wake_app.py
