name: Veri Güncelle

# v2.0.3 - 02:00 TRT (yedekli cron tetikleme)
# Onceki versiyon: "0 1 * * *" (TRT 04:00) - GitHub free tier 04:00 yerine
# 07:59'da tetikledi (4 saat gecikme). Bahri'nin BIST acilisi (10:00) icin
# verinin guncel olmasi gerekiyor.
#
# Yeni versiyon: 02:00 TRT (UTC 23:00 onceki gun) - gece yarisindan sonra
# GitHub Actions yogunlugu cok daha az, skip ihtimali dusuk.
# Yedekli iki cron: 02:00 ve 03:00 - en kotu ihtimalle 03:00'de calisir,
# 10:00 BIST acilisina kadar bol bol zaman var.
#
# Eger her iki cron tutarsa: ilki CSV'yi gunceller + push eder. Ikincisi
# "Degisiklik yok - commit atlandi" der (worker.py ayni veriyi uretir,
# git diff bos). Sorun yok.
#
# v2.0.4.8 (4 Temmuz 2026): Fiyat Tespit Raporu PDF'lerinden arz fiyati/
# iskonto otomatik cikarma ozelligi eklendi (upcoming_ipo_client.py).
# Cogu rapor taranmis/gorsel PDF oldugundan Turkce OCR (tesseract-ocr-tur)
# gerekiyor - bu yuzden asagida yeni bir "Turkce OCR paketlerini kur" adimi
# ve pip bagimliliklarina pdfplumber + pytesseract eklendi.

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = TRT 02:00 - Birincil
    - cron: '0 0 * * *'    # UTC 00:00 = TRT 03:00 - Yedek
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Türkçe OCR paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur

      - name: Bagimliliklari yukle
        run: |
          pip install --upgrade pip --quiet
          pip install pandas yfinance plotly streamlit requests pytefas \
                      bcrypt borsapy psycopg2-binary openpyxl \
                      pdfplumber pytesseract --quiet

      - name: CSV oncesi durum
        run: |
          if [ -f "optimized_universe.csv" ]; then
            ROWS=$(wc -l < optimized_universe.csv)
            FILE_DATE=$(stat -c %y optimized_universe.csv | cut -d' ' -f1)
            echo "CSV mevcut: $ROWS satir (son guncelleme: $FILE_DATE)"
          else
            echo "UYARI: optimized_universe.csv yok, worker olusturacak"
          fi

      - name: worker.py calistir (BIST + TEFAS + Kripto + Doviz + Maden)
        run: |
          echo "Worker baslatiliyor - $(date)"
          python worker.py
          echo "Worker tamamlandi - $(date)"
        env:
          TCMB_KEY: ${{ secrets.TCMB_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: CSV sonrasi durum
        run: |
          if [ -f "optimized_universe.csv" ]; then
            ROWS=$(wc -l < optimized_universe.csv)
            echo "Worker sonrasi CSV: $ROWS satir"
            head -1 optimized_universe.csv
            echo "BIST orneklem (ilk 5 satir):"
            grep "BIST," optimized_universe.csv | head -5
          else
            echo "HATA: worker CSV uretmedi!"
            exit 1
          fi

      - name: CSV'yi commit + push et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f optimized_universe.csv
          git add -f upcoming_ipo_cache/
          if git diff --cached --quiet; then
            echo "Degisiklik yok - commit atlandi"
          else
            git commit -m "Veri guncelleme (otomatik) - $(date +'%Y-%m-%d %H:%M TRT')"
            git push origin main
            echo "CSV pushlandi"
          fi
