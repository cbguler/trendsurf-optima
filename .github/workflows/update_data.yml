name: Veri Güncelle

on:
  schedule:
    - cron: '0 2 * * *'   # Her gün 02:00 UTC = 05:00 TR (yaz saati)
  workflow_dispatch:        # Manuel tetikleme butonu

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: CSV varlık kontrolü
        run: |
          if [ -f "optimized_universe.csv" ]; then
            ROWS=$(wc -l < optimized_universe.csv)
            echo "CSV mevcut: $ROWS satır"
          else
            echo "UYARI: optimized_universe.csv bulunamadı!"
            exit 1
          fi

      - name: Streamlit Cloud yenileme trigger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "streamlit refresh $(date +'%Y-%m-%d %H:%M')"
          git push
