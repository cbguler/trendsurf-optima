name: ENAG Enflasyon Izleme

# v2.0.7.317 (16 Eylul 2026, Bahri'nin talebi - "elle giris asla
# olmamali, otomatik giris ve otonom yonetim esas olmalidir"): ENAG'in
# aylik enflasyon oranini TAM OTOMATIK tespit eder - elle giris YOKTUR.
#
# ONCEKI DENEME (v2.0.7.314) enagrup.org'un kendi PDF bultenini
# cekmeyi deniyordu - o site Cloudflare TLS seviyesinde (HTTP 525)
# TAMAMEN erisilemez bulunmustu. YENI YONTEM CANLI DOGRULANDI: Halk
# TV, ENAG her ay duyurdugunda ayni gun "Son dakika | ENAG ...
# enflasyonunu acikladi" basligiyla haber yapiyor, bu haberin meta
# aciklamasi sabit bir kalipta ay/yil/orani iceriyor - Agustos 2026
# verisiyle canli test edildi, dogru sonuc verdi.
#
# GUNLUK zamanlama (workflow_dispatch DEGIL, TAM OTONOM) - ENAG ayda
# sadece 1 kez (genelde ayin 3-5'i) yayinliyor ama script GUVENLI
# sekilde her gun calisabilir (idempotent: zaten kayitli bir ay
# tekrar yazilirsa sessizce guncellenir, hata vermez). Diger
# workflow'larla AYNI desen: cron-job.org gunde 1 kez tetikler
# (GitHub'in kendi schedule'i BILEREK kullanilmiyor - bkz.
# haber_izleme.yml/kap_bildirim_izleme.yml'deki ayni gerekce, GitHub'in
# schedule'i gecmiste guvenilmez bulunmustu).
#
# BAHRI'DEN BEKLENEN: cron-job.org'da mevcut islerden birini
# cogaltarak "TrendSurf ENAG Izleme" adinda yeni bir is kur - GUNDE 1
# KEZ (ornegin her gun saat 09:00), workflow adi
# "enag_izleme.yml" olacak sekilde.

on:
  workflow_dispatch:

concurrency:
  group: enag-izleme
  cancel-in-progress: false

jobs:
  izle:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari yukle
        run: |
          pip install --upgrade pip --quiet
          # requests: Halk TV'ye HTTP istekleri icin.
          # psycopg2-binary: db.py'nin Supabase baglantisi icin.
          pip install requests psycopg2-binary --quiet

      - name: ENAG izleme calistir
        run: python enag_izleme.py
        env:
          # Bu script cok az sayida veritabani islemi yapiyor (ticker
          # bazli degil, sadece birkac okuma/yazma) - haber_izleme.py/
          # kap_bildirim_izleme.py'deki gibi Session pooler'a GEREK
          # YOK, normal (Transaction pooler) SUPABASE_DB_URL yeterli.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
