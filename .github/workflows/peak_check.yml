name: Peak Check Alert System

# v2.0.3 - Akilli cron schedule (BIST yogun saatlerinde daha sik)
# Onceki versiyon: "*/15 * * * *" (her 15 dakikada bir, 7/24)
# Yeni versiyon: BIST aktif saatlerinde (TRT 10:00-18:00 hafta ici) yogun,
# diger zamanlarda kripto icin daha seyrek tetikleme.
#
# Hesap:
# - BIST yogun: 18 tetikleme/gun (10:00, 10:30, 11:00 ... 18:30) x 5/7 = ~64/hafta
# - Diger saatler/gunler: 12 tetikleme/gun (2 saatte bir) x 7 = 84/hafta
# - Toplam: ~148/hafta x 4.3 = ~636 tetikleme/ay x 1.5 dk = ~954 dk/ay
# - Free tier 2000 dk - rahat altinda.
#
# Yedekli cron tetiklemeleri: her bir slot icin 2 dakika offset ile yedek
# (XX:00 ve XX:02). GitHub skip ihtimaline karsi.
# Peak alert flag mekanizmasi (alert_sent_for_current_peak) zaten duplicate
# mail engelliyor - yedekli cron sorun olmaz.

on:
  schedule:
    # BIST aktif saatleri: TRT 10:00-18:30 hafta ici (Pzt-Cum) - her 30 dk
    # UTC karsiligi: 07:00-15:30 (yaz saati TR = UTC+3)
    - cron: "0,30 7-15 * * 1-5"
    - cron: "2,32 7-15 * * 1-5"   # Yedek (2 dk offset)
    # Diger saatler ve hafta sonu: kripto + flag set kullanicilar - her 2 saatte
    - cron: "0 0-6,16-23 * * *"   # UTC 00-06 ve 16-23 (TRT 03-09 ve 19-02)
    - cron: "0 */2 * * 6,0"        # Hafta sonu her 2 saatte
  workflow_dispatch:
    inputs:
      force:
        description: 'Interval/weekend kontrollerini atla (manuel test icin)'
        type: boolean
        default: false

jobs:
  peak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install pandas yfinance plotly streamlit requests pytefas bcrypt borsapy psycopg2-binary --quiet

      - name: Check data file (informational)
        run: |
          if [ -f "optimized_universe.csv" ]; then
            echo "CSV mevcut: $(wc -l < optimized_universe.csv) satir"
            echo "BIST/MADEN/DOVIZ/KRIPTO icin borsapy ile live refresh uygulanacak."
          else
            echo "UYARI: optimized_universe.csv yok"
          fi

      - name: Run peak check
        env:
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          SUPABASE_DB_URL:    ${{ secrets.SUPABASE_DB_URL }}
          PEAK_CHECK_FORCE:   ${{ inputs.force || 'false' }}
        run: python peak_check_standalone.py
