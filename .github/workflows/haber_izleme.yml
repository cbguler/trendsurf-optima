name: Beklenti Modu Haber Izleme

# v2.0.7.154+155 (18 Agustos 2026, Bahri'nin talebi): Beklenti Modu'nun
# otomatik haber izleme katmani. RSS kaynaklarini (AA/BBC/Al Jazeera/
# Investing.com/BloombergHT) 10 dakikada bir tarar, anahtar kelime
# on-filtresinden gecen haberleri Google Gemini API (ucretsiz katman)
# ile dogrular, dogrulanan tespitleri Supabase'e yazar - app.py bunlari
# OTOMATIK olarak Optima Skor'a uygular.
#
# v2.0.7.155: Anthropic API'den Google Gemini API'ye gecildi (Bahri:
# "ucretli ise kurmayacagim, ucretsiz alternatif bulalim") - Gemini'nin
# kredi karti gerektirmeyen gercek bir ucretsiz katmani var.
#
# v2.0.7.182 (25 Agustos 2026, Bahri'nin cron-job.org kurulumu
# dogrulandi - test tetiklemesi "204 No Content" ile basarili oldu,
# gercek deger: github-authentication-token-expiration: 2026-10-06):
# GitHub'in kendi schedule bloğu TAMAMEN KALDIRILDI. Bunun yerine
# cron-job.org (harici, ucretsiz cron servisi) 10 dakikada bir
# GitHub REST API'sine POST istegi atip bu workflow'u workflow_dispatch
# ile tetikliyor - send_email.yml'de (v2.0.3.8) zaten kanitlanmis olan
# AYNI yontem:
#   POST https://api.github.com/repos/cbguler/trendsurf-optima/actions/workflows/haber_izleme.yml/dispatches
#   Body: {"ref":"main"}
#   Auth: fine-grained PAT (sadece bu repo, sadece Actions:write yetkisi -
#         send_email.yml ile AYNI token, "TrendSurf Mail" isinden cogaltildi)
#
# GitHub'in kendi schedule cron'u free/public tier'da TAM ZAMANDA
# calismiyordu (yukarida artik silinen 10 dakikalik schedule, "best-effort"
# calisiyordu - bazen 25-40 dk araliklarla). cron-job.org disaridan API ile
# zorlanmis tetikleme yaptigi icin bu throttling sorununu tamamen by-pass
# ediyor.
#
# ONEMLI HATIRLATMA: kullanilan PAT'in gecerlilik suresi 6 Ekim 2026'da
# doluyor - o tarihten once yenilenmesi (ya da suresiz bir token ile
# degistirilmesi) gerekiyor, yoksa bu tetikleme sessizce 401 hatasiyla
# basarisiz olmaya baslar.
#
# workflow_dispatch: asagida kaliyor - hem cron-job.org'un disaridan
# tetiklemesi hem de GitHub arayuzunden manuel "Run workflow" ile
# calistirilabilir.

on:
  workflow_dispatch:

concurrency:
  group: haber-izleme
  cancel-in-progress: false

jobs:
  izle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari yukle
        run: |
          pip install --upgrade pip --quiet
          # v2.0.7.178 (Bahri'nin bulgusu, 21 Agustos 2026 - "ModuleNotFoundError:
          # No module named 'deep_translator'"): KOK NEDEN - bu workflow
          # requirements.txt'e HIC BAKMIYOR, kendi ayri/minimal paket
          # listesini kuruyor. v2.0.7.176'da deep-translator SADECE
          # requirements.txt'e eklenmisti - bu workflow'un kendi listesine
          # eklenmedigi icin ucretsiz yedek ceviri hic calisamiyordu
          # (Gemini 429 alinca dogru sekilde yedege duesuyordu, ama
          # yedegin kendisi hic kurulu degildi).
          pip install feedparser requests psycopg2-binary deep-translator --quiet

      - name: Haber izleme calistir
        run: python haber_izleme.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
