name: TEFAS Aksam Guncelle

# v2.0.4.51: TEFAS fonlari akşam (~19:00-21:00 TRT) NAV yayinliyor.
# Mevcut update_data.yml (worker.py tam calistirir - BIST+Kripto+Maden+
# Halka Arz PDF/OCR dahil, birkac dakika surer) sadece gece TRT 02:00/
# 03:00'de calistigi icin, aksam yayinlanan NAV ancak ertesi sabah
# yakalaniyordu (~5-7 saat gecikme). Bu workflow SADECE TEFAS satirlarini
# gunceller (update_tefas_evening.py), diger kategorilere dokunmaz -
# bu yuzden cok daha hizli (worker.py'nin tamami yerine sadece TEFAS).
#
# v2.0.7.165 (Bahri'nin bulgusu, 20 Agustos 2026 - ING hesabindaki
# gercek degerlerin bizden farkli cikmasi): TEK gunluk cekim (~20:00
# TRT) YETERSIZ bulundu. Arastirma (caziphesap.com, iyigelir.net ve
# digerleri): TEFAS'in genel kurali "fiyatlar borsalar kapandiktan
# sonra GUNDE BIR KEZ hesaplanir, ERTESI IS GUNUNDE ilan edilir" - yani
# T gununun kapanisiyla hesaplanan NAV, T+1'in KENDISINDE (muhtemelen
# sabahtan itibaren) yayinlanir, T aksami DEGIL. Bizim tek cekimimiz
# (~20:00 TRT) o gun zaten SABAHTAN beri hazir olan bir bilgiyi
# gereksiz yere aksama kadar bekletiyordu - Bahri'nin bankasinda
# gordugu "guncel" deger, bizim o aksamki cekimimizden SAATLERCE once
# zaten yayinlanmisti.
# COZUM: BIST'in peak_check.yml'inde zaten kullanilan "gun icine
# yayilmis sik kontrol" felsefesi TEFAS'a da uygulandi - artik GUNDE
# TEK yerine 7 KEZ (TRT 08/10/12/14/16/18/20, 2 saatte bir) kontrol
# ediliyor. TEFAS ne zaman yayinlarsa yayinlasin en gec birkac saat
# icinde yakalanir - artik TEK bir "dogru saat" tahmin etmeye gerek
# yok. update_tefas_evening.py zaten SADECE DEGISIKLIK VARSA commit
# atiyor (asagida "git diff --cached --quiet" kontrolu) - yani
# degisiklik olmayan calismalarin maliyeti bir GitHub Actions dakikasi,
# commit/push YOK.
#
# Iki tetikleyici/slot (mevcut update_data.yml'deki yedekli-cron
# mantigiyla ayni): GitHub Actions'in kendi cron gecikmesi ihtimaline
# karsi, her slot icin 2 dakika offsetli bir yedek var.

# v2.0.7.218 (Bahri'nin bulgusu, 30 Ağustos 2026 - saat 09:03'te ING
# bankadaki gerçek portföy değeri (27.889,12 TL) ile uygulamanın
# gösterdiği değer (27.869,55 TL) arasında fark bulundu): 2 SAATLİK
# ARALIK SABAH PENCERESİNDE YETERSİZ KALDI. Kesin kök neden: Bahri'nin
# gözlemi TAM OLARAK 08:00 çalışmasından SONRA, 10:00 çalışmasından
# ÖNCE yapılmış - TEFAS muhtemelen bu ~1 saatlik aralıkta yeni NAV
# yayınlamıştı, biz ancak 10:00'da yakalayacaktık (en fazla ~2 saatlik
# gecikme riski). ÇÖZÜM: Sabah penceresi (TRT 07:00-09:30) artık 30
# DAKİKADA BİR kontrol ediliyor (6 kontrol), günün geri kalanı (TRT
# 10-20) eski 2 saatlik aralıkta kalıyor - TOPLAM günde 7'den 12
# çalışmaya çıkıyor. Maliyet düşük: değişiklik yoksa sadece ~1 GitHub
# Actions dakikası, commit/push yok (aşağıdaki "git diff --cached
# --quiet" kontrolü zaten böyle çalışıyordu).

on:
  schedule:
    # TRT 07:00,07:30,08:00,08:30,09:00,09:30 = UTC 04:00-06:30 (30 dk aralikla)
    - cron: '0,30 4,5,6 * * *'      # Birincil - sabah yogun pencere
    - cron: '2,32 4,5,6 * * *'      # Yedek (2 dk offset) - sabah yogun pencere
    # TRT 10,12,14,16,18,20 = UTC 07,09,11,13,15,17 (2 saatte bir, eskisi gibi)
    - cron: '0 7,9,11,13,15,17 * * *'   # Birincil - gunun geri kalani
    - cron: '2 7,9,11,13,15,17 * * *'   # Yedek (2 dk offset) - gunun geri kalani
  workflow_dispatch:

jobs:
  update_tefas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari yukle
        run: |
          pip install --upgrade pip --quiet
          pip install pandas pytefas openpyxl --quiet

      - name: update_tefas_evening.py calistir
        run: |
          echo "TEFAS aksam guncellemesi baslatiliyor - $(date)"
          python update_tefas_evening.py
          echo "Tamamlandi - $(date)"

      - name: CSV'yi commit + push et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f optimized_universe.csv
          if git diff --cached --quiet; then
            echo "Degisiklik yok - commit atlandi"
          else
            # v2.0.7.165 (kucuk kozmetik duzeltme, ayni dosyaya dokunurken
            # fark edildi): eskiden `date +'%Y-%m-%d %H:%M TRT'` GitHub
            # runner'inin kendi saatini (UTC) yazip yanlislikla "TRT"
            # diye etiketliyordu (ornek: gercekte 20:28 TRT olan bir
            # calisma, commit mesajinda "17:28 TRT" gorunuyordu - 3 saat
            # yanlis). TZ=Europe/Istanbul ile artik GERCEKTEN TRT yaziyor.
            git commit -m "TEFAS aksam guncelleme (otomatik) - $(TZ='Europe/Istanbul' date +'%Y-%m-%d %H:%M TRT')"
            # v2.0.7.97 - KRITIK DUZELTME (Bahri'nin bulgusu, 20 Temmuz 2026):
            # update_data.yml'de yasanan "non-fast-forward"/"divergent
            # branches" hatalarinin (v2.0.7.85/97) AYNISI burada da
            # olabilirdi - bu workflow push oncesi HIC pull yapmiyordu.
            git pull --no-edit --no-rebase origin main
            git push origin main
            echo "TEFAS CSV pushlandi"
          fi
